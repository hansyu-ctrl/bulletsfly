<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>讓子彈飛｜進入鵝城</title>
<style>
:root{--bg:#f4ead5;--card:#fffaf0;--ink:#2b1a12;--sub:#6b5445;--red:#a3201a;--gold:#b8860b;--line:#d9c6a3;--ok:#2e7d32;--bad:#b71c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a0f0b;--card:#2a1812;--ink:#f3e6cf;--sub:#b9a085;--red:#e0483f;--gold:#e0b04a;--line:#4a3126;--ok:#66bb6a;--bad:#ef5350}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:24px 20px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
h1{font-size:2.4rem;margin:.2em 0;color:var(--red);letter-spacing:.15em;text-align:center}
.tag{text-align:center;color:var(--gold);letter-spacing:.3em;font-size:.95rem}
.sub{text-align:center;color:var(--sub);line-height:1.8}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--red);background:var(--red);color:#fff;padding:12px 20px;font-size:1.05rem;letter-spacing:.1em}
button.ghost{background:transparent;color:var(--red)}
.center{display:flex;justify-content:center;margin-top:22px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.9rem;margin-bottom:14px}
.ic{width:88px;height:88px;margin:0 auto 14px;border-radius:50%;background:var(--bg);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.q{font-size:1.2rem;line-height:1.7;margin:0 0 16px;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:10px 0;background:var(--bg);color:var(--ink);border:2px solid var(--line);letter-spacing:0;line-height:1.6;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--bg))}
.fb{min-height:1.6em;margin-top:8px;font-weight:700}
.score{font-size:4rem;color:var(--red);text-align:center;margin:0}
.role{font-size:2rem;text-align:center;color:var(--gold);margin:.2em 0;font-weight:700;letter-spacing:.2em}
.cmt{text-align:center;font-size:1.15rem;line-height:1.8}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
#shot{display:block;max-width:100%;margin:18px auto 0;border-radius:10px;border:2px solid var(--line)}
.toast{text-align:center;color:var(--sub);margin-top:12px;min-height:1.4em;font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="home" class="card">
  <div class="tag">— 民國九年 · 鵝城 —</div>
  <div class="ic" aria-hidden="true">🏰</div>
  <h1>讓子彈飛</h1>
  <p class="sub">20 題電影問答，答對一題 5 分，<br>答錯不計分。<br>此城凶險，看看你能不能走過這一遭</p>
  <div class="center"><button id="start">進入鵝城</button></div>
</section>

<section id="quiz" class="card" hidden>
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="no"></span><span id="sc"></span></div>
  <div class="ic" id="ic" aria-hidden="true"></div>
  <p class="q" id="qt"></p>
  <div id="opts"></div>
  <div class="fb" id="fb"></div>
  <div class="center"><button id="next" hidden>下一題</button></div>
</section>

<section id="result" class="card" hidden>
  <div class="tag">— 你的結局 —</div>
  <div class="ic" id="ric" aria-hidden="true"></div>
  <p class="score"><span id="rs">0</span><small style="font-size:1.2rem"> 分</small></p>
  <p class="role" id="rr"></p>
  <p class="cmt" id="rc"></p>
  <div class="row">
    <button id="share">分享網址</button>
    <button id="snap">產生結果截圖</button>
    <button id="again" class="ghost">重新測驗</button>
  </div>
  <div class="toast" id="toast"></div>
  <img id="shot" alt="結果截圖" hidden>
  <p class="sub" id="hint" hidden style="font-size:.9rem">長按（或右鍵）圖片即可儲存</p>
</section>
</main>
<script>
const P="報告縣長，我們",S="陸軍，護衛縣長安全上任！我們！不吃飯！";
// 格式：[題目, 正解, 錯誤1, 錯誤2, 錯誤3]
const Q=[
["一開始，馬邦德邀請車上的護衛隊一起吃飯、一起唱歌，他們怎麼回答？",P+"鐵血十八星"+S,P+"黑色三連星"+S,P+"黃埔十三軍"+S,P+"鐵戰十九星"+S],
["張麻子審完武舉人、替賣涼粉的孫守義做主後，門外百姓跪地大喊什麼？","青天大老爺","青天老爺子","公正大老爺","公正老爺子"],
["武智沖在縣衙受審時，拿什麼身分來壓張麻子？","光緒年間皇上欽點的武舉人","宣統皇帝親封的團練總兵","朝廷派來的縣令","黃四郎的結拜兄弟"],
["武智沖與張麻子衝突時，武智沖要求誰向誰下跪？","張麻子向武智沖下跪","孫守義向張麻子下跪","湯師爺向武智沖下跪","黃四郎向張麻子下跪"],
["武智沖向黃四郎抱怨挨打時，哪句話最符合電影中的台詞？","打的不是我的屁股，是您的臉","打的不是我的腿，是您的臉","打的不是我的手，是您的臉","打的不是我的頭，是您的臉"],
["黃四郎在宴席上送給張麻子的禮物是什麼？","兩顆鑽石","兩根金條","一把手槍","一枚官印"],
["張麻子要求湯師爺在限定時間內交代錢藏在哪裡時，說了哪句話？","哭？哭也算時間喔！","哭有什麼用？","再哭就開槍！","你慢慢哭，我等你。"],
["湯師爺談到寫詩時，提及哪一組元素？","風、肉、火鍋、霧、美女、驢","雨、酒、茶、月亮、美女、馬","風、雪、刀、酒、江湖、馬","火、肉、烈酒、美女、金銀、驢"],
["張麻子在鵝城宣告自己只辦三件事，接著連說了什麼？","公平！公平！還是公平！","金錢！金錢！還是金錢！","民心！民心！還是民心！","勝利！勝利！還是勝利！"],
["小六子被指控吃兩碗涼粉卻只付一碗的錢，最後用什麼方式證明清白？","當眾剖腹驗粉","找出店家的帳本","讓孫守義重新作證","把剩下的涼粉全部吃完"],
["黃四郎得知張麻子喜歡審案後，如何利用這一點設局？","找人製造案件，讓張麻子介入","派人假扮縣長","立刻向省城告狀","把武智沖撤職"],
["老七在兄弟們談論各自特點時，最有名的自我描述是什麼？","我喜歡被動","我喜歡主動","我萬事不求人","我從不仗勢欺人"],
["老五介紹自己時，除了提到自己年紀大，還說了什麼？","至今仍是處男","從未殺過人","不會喝酒","沒有當過兵"],
["兄弟們輪流談自己的特點時，老三最有代表性的說法是哪句？","萬事不求人","我喜歡被動","我至今還是處男","我不會使槍"],
["花姐拿著槍抵著自己的頭，張麻子說搞不懂，這時候湯師爺（偽）說了什麼？","AB 型","我也看不懂","小鳳仙","有毛病"],
["老六說將來也想當縣長時，張麻子明確告訴他不要做什麼？","不要當縣長，也不許當土匪","不要讀書，也不要出洋","不要離開鵝城","不要跟任何人交朋友"],
["湯師爺提到鵝城前幾任縣長收稅，最誇張地收到多久以後？","九十年後","十年後","三十年後","五十年後"],
["張麻子怒問「翻譯出來給我聽，什麼他媽的叫驚喜！什麼他媽的叫他媽的驚喜！」這裡的「驚喜」究竟是什麼？","三天之後，黃四郎出一百八十萬，讓張麻子等人出城剿匪，接上黃四郎這條大腿","兩大家族與黃四郎一同出資剿匪","胡萬？怎麼會是胡萬？真他媽是驚喜","殺人還要誅心，好可怕呀"],
["黃四郎在劇中有提到某個人有三條腿，是以下哪一位？","劉都統","郭旅長","孫守義","胡千"],
["張牧之在當麻匪前，曾當過誰的手槍隊長？","蔡鍔","唐繼堯","梁啟超","李宗仁"]
];
const ICONS=["🪖","🙇","🏛️","🙏","🤕","🥂","⏱️","📜","📢","🍜","🎭","🙃","👴","🍻","💃","🎩","💰","🎁","🦵","🔫"];
Q.forEach((q,i)=>q.push(ICONS[i]));
const R=[
{max:30,i:"🍜",n:"小六",c:"終究還是為了腸粉犧牲"},
{max:60,i:"🍑",n:"馬邦德",c:"終究還是個老騙子，屁股都給騙樹上去了"},
{max:80,i:"🎩",n:"黃四郎",c:"禮帽禮貌，終究輸給自己的替身"},
{max:100,i:"🔫",n:"張牧之",c:"仗義了一切，終究只剩下自己一位"}
];
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let deck,idx,score,locked,final;
function show(id){["home","quiz","result"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function start(){deck=shuf(Q);idx=0;score=0;show("quiz");render()}
function render(){
  const [q,ok,...rest]=deck[idx];const ic=rest.pop(),bad=rest;locked=false;$("ic").textContent=ic;
  $("no").textContent="第 "+(idx+1)+" / "+deck.length+" 題";
  $("sc").textContent="目前 "+score+" 分";
  $("pb").style.width=(idx/deck.length*100)+"%";
  $("qt").textContent=q;$("fb").textContent="";$("fb").style.color="";$("next").hidden=true;
  const box=$("opts");box.innerHTML="";
  shuf([ok,...bad]).forEach(t=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>pick(b,t===ok,ok);box.appendChild(b);
  });
}
function pick(b,right,ok){
  if(locked)return;locked=true;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===ok)x.classList.add("ok")});
  if(right){score+=5;$("fb").textContent="答對了！+5 分";$("fb").style.color="var(--ok)"}
  else{b.classList.add("bad");$("fb").textContent="答錯了，不計分";$("fb").style.color="var(--bad)"}
  $("sc").textContent="目前 "+score+" 分";
  $("next").textContent=idx===deck.length-1?"看結果":"下一題";$("next").hidden=false;
}
function finish(){
  final=R.find(r=>score<=r.max);
  $("rs").textContent=score;$("rr").textContent=final.n;$("ric").textContent=final.i;$("rc").textContent=final.c;
  $("shot").hidden=true;$("hint").hidden=true;$("toast").textContent="";show("result");
}
function wrap(ctx,t,x,y,w,lh){let line="";for(const ch of t){if(ctx.measureText(line+ch).width>w){ctx.fillText(line,x,y);y+=lh;line=ch}else line+=ch}ctx.fillText(line,x,y);return y}
function snap(){
  const c=document.createElement("canvas");c.width=720;c.height=960;const x=c.getContext("2d");
  const f='"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif';
  x.fillStyle="#1a0f0b";x.fillRect(0,0,720,960);
  x.strokeStyle="#e0b04a";x.lineWidth=4;x.strokeRect(24,24,672,912);
  x.strokeStyle="#a3201a";x.lineWidth=2;x.strokeRect(38,38,644,884);
  x.textAlign="center";
  x.fillStyle="#e0b04a";x.font="28px "+f;x.fillText("民國九年 · 鵝城",360,120);
  x.fillStyle="#e0483f";x.font="bold 72px "+f;x.fillText("讓子彈飛",360,215);
  x.fillStyle="#f3e6cf";x.font="30px "+f;x.font="80px "+f;x.fillText(final.i,360,305);x.fillStyle="#f3e6cf";x.font="30px "+f;x.fillText("我的結局是",360,358);
  x.fillStyle="#e0b04a";x.font="bold 110px "+f;x.fillText(final.n,360,470);
  x.fillStyle="#e0483f";x.font="bold 96px "+f;x.fillText(score+" 分",360,610);
  x.fillStyle="#f3e6cf";x.font="34px "+f;wrap(x,"「"+final.c+"」",360,710,560,52);
  x.fillStyle="#b9a085";x.font="24px "+f;x.fillText("你也來鵝城走一遭吧",360,880);
  const url=c.toDataURL("image/png");
  $("shot").src=url;$("shot").hidden=false;$("hint").hidden=false;
  try{const a=document.createElement("a");a.href=url;a.download="讓子彈飛結果.png";a.click()}catch(e){}
  $("toast").textContent="截圖已產生，可長按圖片儲存";
}
async function share(){
  const url=location.href,text="我在「讓子彈飛」得了 "+score+" 分，結局是"+final.n+"！你也來挑戰：";
  try{if(navigator.share){await navigator.share({title:"讓子彈飛",text,url});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);$("toast").textContent="網址已複製！";return}catch(e){}
  $("toast").textContent="請手動複製網址："+url;
}
$("start").onclick=start;$("next").onclick=()=>{idx++;idx<deck.length?render():finish()};
$("share").onclick=share;$("snap").onclick=snap;$("again").onclick=start;
</script>
</body>
</html>
